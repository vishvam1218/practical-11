# ==============================================================================
# Practical 11: Production Nginx Reverse Proxy & Static SPA Server
# Service: Frontend Single Page Application (React 19 + Vite)
# Student: Vishvam Patel (24IT110) | CHARUSAT - ITUE301
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for Fast Assets Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck Endpoint
    location /health {
        access_log off;
        return 200 '{"status":"UP","service":"frontend-nginx","container":"docker"}';
        add_header Content-Type application/json;
    }

    # Reverse Proxy: Forward API requests to backend container via Docker internal DNS
    location /api/ {
        proxy_pass http://backend:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Reverse Proxy: Protected Auth endpoints
    location /auth/ {
        proxy_pass http://backend:5001/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse Proxy: Tasks & Cache & EDA endpoints
    location /tasks/ {
        proxy_pass http://backend:5001/tasks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse Proxy: Practical 11 Container telemetry
    location /container/ {
        proxy_pass http://backend:5001/container/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static Assets Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Single Page Application (SPA) Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom 404 handling
    error_page 404 /index.html;
}
